name: t10

services:
  t10-achievement-client:
    build: .
    container_name: t10-achievement-client
    environment:
      SPRING_RABBITMQ_HOST: tb-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - global-network
    restart: on-failure

networks:
  global-network:
    external: true
