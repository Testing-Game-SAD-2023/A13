server:
  # Porta HTTP esposta da Tempo (usata per healthcheck e UI interna)
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    # Abilita ricezione OTLP (gRPC + HTTP)
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4319
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 24h   # durata di conservazione dei blocchi di trace

metrics_generator:
  storage:
    path: /tmp/tempo/metrics
  processor:
    service_graphs: {}
    span_metrics: {}

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces

