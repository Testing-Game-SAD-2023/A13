# https://opentelemetry.io/docs/collector/configuration/
# Receivers collect telemetry from one or more sources
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

# Processors take the data collected by receivers and modify or transform it before sending it to the exporters
processors:
  batch:
#Filter that aims to cut out prometheus generated traces, in this way the attention is just upon user generated traffic 
  filter/drop_actuator:
    error_mode: ignore
    traces:
      span:
        - 'IsMatch(attributes["http.target"], "/actuator.*")'
        - 'IsMatch(attributes["url.path"], "/actuator.*")'
        - 'IsMatch(attributes["http.route"], "/actuator.*")'

# Exporters send data to one or more backends or destinations
exporters:
  debug:
    verbosity: detailed
  otlphttp/logs:
    endpoint: "http://loki:3100/otlp"
    tls:
      insecure: true
  otlp/traces:
    endpoint: "tempo:4319"
    tls:
      insecure: true

# The service section is used to configure what components are enabled in the Collector based on the configuration found in the receivers, processors, exporters, and extensions sections
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [filter/drop_actuator,batch]
      exporters: [otlp/traces, debug]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/logs, debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
