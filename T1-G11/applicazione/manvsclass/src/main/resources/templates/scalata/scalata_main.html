<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="#{scalata_title}"></title>

    <!-- Importing Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>

    <!-- Importing driver for tour -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.4.0/dist/driver.js.iife.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/driver.js@1.4.0/dist/driver.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="/t1/css/scalata.css">

    <!-- JS -->
    <script defer th:src="@{/t1/js/utils/endpoints.js}"></script>
    <script defer th:src="@{/t1/js/utils/api.js}"></script>
    <script defer th:src="@{/t1/js/scalata/scalata_main.js}"></script>
    <script defer th:src="@{/t1/js/scalata/scalata_main_tour.js}"></script>

</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light px-3">
    <div class="container-fluid">

        <div class="d-flex align-items-center">

            <a class="btn btn-outline-secondary me-2" th:href="@{/dashboard}">
                <i class="bi bi-arrow-left"></i>
            </a>

            <span class="navbar-brand d-flex align-items-center">
                <i class="bi bi-rocket-takeoff"></i>
                <span th:text="#{scalata_title}">Scalate</span>
                <a href="#" id="startTourIcon" title="Avvia tour guidato" class="text-decoration-none ms-2">
                    <i class="bi bi-info-circle"></i>
                </a>
            </span>

        </div>

        <div class="mx-auto">
            <a class="btn btn-outline-success" th:href="@{/scalata/create}">
                <i class="bi bi-plus-lg"></i>
                <span th:text="#{scalata_create_btn}">Crea Scalata</span>
            </a>
        </div>

        <div class="d-flex align-items-center">

            <div class="dropdown me-2">
                <button class="btn btn-outline-secondary dropdown-toggle btn-sm"
                        type="button" data-bs-toggle="dropdown" th:text="#{scalata_sort_btn}">
                    Ordina
                </button>
                <ul class="dropdown-menu">
                    <li><a class="dropdown-item" href="?sortBy=date" th:text="#{scalata_sort_date}">Per Data</a></li>
                    <li><a class="dropdown-item" href="?sortBy=name" th:text="#{scalata_sort_name}">Per Nome</a></li>
                </ul>
            </div>

            <form class="input-group input-group-sm" style="width: 160px;">
                <input type="search" class="form-control" name="search"
                       th:placeholder="#{scalata_search_placeholder}">
                <button class="input-group-text" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </form>

        </div>

    </div>
</nav>


<div class="container my-4 d-flex justify-content-center">
    <div class="col-8 col-md-10 col-lg-8">

        <div class="scalate" th:each="scalata : ${scalate}">

            <details class="card p-3 shadow-sm rounded-3 mb-3">

                <summary class="d-flex justify-content-between align-items-start">

                    <div class="d-flex flex-column">
                        <span class="fw-bold fs-5" th:text="${scalata.name}">Nome Scalata</span>
                        <span>
                            <span class="text-muted" th:text="#{scalata_created_by}">Creato da:</span>
                            <small th:text="${scalata.username}">creatore</small>
                            •
                            <span class="text-muted" th:text="#{scalata_date}">Data:</span>
                            <small th:text="${scalata.date}">02/10/2025</small>
                            •
                            <span class="text-muted" th:text="#{scalata_levels}">Livelli:</span>
                            <small th:text="${scalata.numberOfLevels}">5</small>
                        </span>

                    </div>

                    <div>
                        <button class="btn btn-danger delete-button" th:data-name="${scalata.name}">
                            <i class="bi bi-trash"></i>
                            <span class="d-none" th:text="#{scalata_delete_btn}">Elimina</span>
                        </button>
                    </div>

                </summary>

                <div class="card-body">
                    <p th:text="${scalata.description}">Qui ho la descrizione della scalata</p>

                    <hr>

                    <div class="py-1 border rounded-4" th:each="level, iter : ${scalata.listOfLevels}">
                        <span class="px-2 py-1 border-end border-2 rounded-4 bg-light">

                            <span th:switch="${level.opponent.opponentDifficulty.name()}">
                                <span class="badge rounded-pill bg-success" th:case="'EASY'" th:text="#{difficulty_easy}">Facile</span>
                                <span class="badge rounded-pill bg-warning" th:case="'MEDIUM'" th:text="#{difficulty_medium}">Medio</span>
                                <span class="badge rounded-pill bg-danger" th:case="'HARD'" th:text="#{difficulty_hard}">Difficile</span>
                            </span>

                            <span class="fw-bold" th:text="#{scalata_level_number(${iter.count})}">Livello <span th:text="${iter.count}">?</span></span>
                        </span>

                        <span class="mx-3">
                            <span th:text="#{scalata_opponent_label}">Avversario:</span>
                            <small class="text-danger" th:text="${level.opponent.opponentType}">ChatGPT</small>
                            •
                            <span th:text="#{scalata_class_label}">Classe:</span>
                            <small class="text-success" th:text="${level.opponent.classUT}">Calcolatrice</small>
                            •
                            <span th:text="#{scalata_max_time_label}">TempoMax:</span>
                            <small class="text-primary"><span th:text="${level.tempoMax}"></span><span th:text="#{unit_min}">min</span></small>
                        </span>
                    </div>

                </div>
            </details>

        </div>


    </div>


</div>

</body>
</html>
