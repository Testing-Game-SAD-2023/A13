<!DOCTYPE html>
<html>
<body>
    <h1>Test SSE Minimale</h1>
    <input type="number" id="userId" value="42">
    <button onclick="start()">CONNETTI</button>
    <div id="log" style="white-space: pre; font-family: monospace; margin-top: 20px;"></div>

    <script>
        function log(msg) {
            document.getElementById('log').innerText += msg + "\n";
            console.log(msg);
        }

        function start() {
            const id = document.getElementById('userId').value;
            const url = 'http://127.0.0.1:8089/notifications/subscribe/' + id;
            
            log("Provo a connettermi a: " + url);
            
            const eventSource = new EventSource(url);

            eventSource.onopen = () => log("✅ OPEN: Connessione aperta!");
            
            eventSource.addEventListener('NOTIFICATION', (e) => {
                log("📩 NOTIFICATION: " + e.data);
            });

            eventSource.onerror = (e) => {
                // Se readyState è 0 (CONNECTING) o 2 (CLOSED)
                log("⚠️ ERROR/RETRY state: " + eventSource.readyState);
            };
        }
    </script>
</body>
</html>
