server:
  port: 8089

spring:
  datasource:
    url: ${DB_URL}
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  main:
    banner-mode: off

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

llm:
  api-url: https://api.groq.com/openai/v1/chat/completions
  api-key: ${GROQ_API_KEY}
  model: llama-3.3-70b-versatile

# ⚠️ In Docker, localhost NON è T4. Usa il nome del container sulla global-network
t4:
  base-url: http://t4-controller:8084
