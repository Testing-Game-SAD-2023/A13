spring.application.name=t9-notification
server.port=8080

spring.messages.basename=lang/messages

spring.datasource.url=${DB_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
# spring.jpa.show-sql=true

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}

# OpenTelemetry (se serve, come in T4)
otel.resource.attributes.service.name=T9
otel.traces.exporter=otlp
otel.exporter.otlp.traces.endpoint=http://otel-collector:4317
otel.exporter.otlp.protocol=grpc
