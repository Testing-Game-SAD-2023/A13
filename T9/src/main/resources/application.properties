spring.application.name=t9-notification
server.port=8080

spring.messages.basename=lang/messages

# Database - usa le variabili d'ambiente da Docker, altrimenti localhost per sviluppo locale
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/t9_database}
spring.datasource.username=${POSTGRES_USERNAME:t9_service}
spring.datasource.password=${POSTGRES_PASSWORD:t9_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update

# RabbitMQ - usa le variabili d'ambiente da Docker, altrimenti localhost per sviluppo locale
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:guest}

# Log per debug RabbitMQ
logging.level.org.springframework.amqp=DEBUG
logging.level.org.springframework.amqp.rabbit=DEBUG