server.port=8089

# Database configuration
# Usa DB_URL se presente, altrimenti va su localhost (utile se avvii senza Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studentsrepo}
spring.datasource.username=${MYSQL_USER:user}
spring.datasource.password=${MYSQL_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Spring main
spring.main.banner-mode=off

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ---------------------------------------------------------
# LLM CONFIGURATION (Groq)
# ---------------------------------------------------------

# Endpoint API Groq compatibile con OpenAI
llm.api-url=https://api.groq.com/openai/v1/chat/completions

# API key letta da variabile d'ambiente per sicurezza
llm.api-key=${GROQ_API_KEY}

# Modello LLaMA consigliato
llm.model=llama-3.3-70b-versatile
