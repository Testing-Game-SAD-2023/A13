name: t8

services:
  t8_generazione:
    image: mick0974/a13:t8-g21
    container_name: t8-controller
    expose:
      - 8088
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    networks:
      - global-network
    volumes:
      - VolumeT0:/VolumeT0

networks:
  global-network:
    external: true

volumes:
  VolumeT0:
    external: true