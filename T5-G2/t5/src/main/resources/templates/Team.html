<!DOCTYPE html>
<html lang="it" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Teams</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
<!-- NAVBAR -->
<div th:replace="fragments/navbar :: navbar"></div>

<!-- PAGE -->
<div class="container my-5">
    <!-- Titolo + Bottoni -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold">Teams</h3>
        <div class="d-flex gap-2">
            <!-- Bottone che mostra il form -->
            <button class="btn btn-success d-flex align-items-center gap-2 px-3 py-2"
                    type="button" data-bs-toggle="collapse" data-bs-target="#createTeamForm">
                <i class="bi bi-plus-circle"></i>
                <span class="fw-bold">Crea Team</span>
            </button>
            <!-- Bottone Aggiungi Team -->
            <a href="/join_team" class="btn btn-primary d-flex align-items-center gap-2 px-3 py-2">
                <i class="bi bi-people-fill"></i>
                <span class="fw-bold">Aggiungi Team</span>
            </a>
        </div>
    </div>

    <!-- Form di creazione team (collassabile) -->
    <div class="collapse mb-4" id="createTeamForm">
        <div class="card card-body">
            <form th:action="@{/create_team}" method="post" enctype="multipart/form-data" th:object="${teamForm}">
                <div class="mb-3">
                    <label for="teamName" class="form-label">Nome Team</label>
                    <input type="text" class="form-control" id="teamName" th:field="*{teamName}" required>
                </div>
                <div class="mb-3">
                    <label for="teamImage" class="form-label">Immagine Team</label>
                    <input type="file" class="form-control" id="teamImage" name="teamImage" accept="image/*">
                </div>
                <button type="submit" class="btn btn-success">Crea</button>
            </form>
        </div>
    </div>

    <!-- Barra di ricerca -->
    <div class="position-relative mb-4">
        <input type="text" class="form-control search-chat py-2 ps-5" id="text-srh_teams" placeholder="Search Teams">
        <i class="ti ti-search position-absolute top-50 start-0 translate-middle-y text-dark ms-3"></i>
    </div>

    <!-- Lista Teams -->
    <div class="row row-cols-1 row-cols-md-2 g-4" id="teams_block">
        <!-- Ciclo Thymeleaf per mostrare i team -->
        <div class="col" th:each="response : ${teams}">
            <div class="card h-100 text-center p-3">
                <!-- Immagine del team -->
                <img th:src="@{${response.team.teamImagePath}}" class="img-fluid rounded mb-3" alt="Team Image">
                <!-- Nome del team -->
                <h5 class="fw-bold" th:text="${response.team.teamName}">Nome Team</h5>
                <!-- Descrizione -->
                <p class="text-muted" th:text="${response.team.description}">Descrizione breve del team...</p>
                <!-- Link alla pagina del team -->
                <a th:href="@{'/team/' + ${response.team.id}}" class="btn btn-outline-primary">Vai al Team</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
