<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Profilo</title>

	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

	<style>
		:root{
			--profile-bg: #0b1b2b;
			--profile-accent: #198754;
		}
		body{
			background: var(--profile-bg);
		}
		.card-accent{
			border-top: 4px solid var(--profile-accent);
		}
		#avatarPicker img{
			width: 56px;
			height: 56px;
			border-radius: 12px;
			cursor: pointer;
			object-fit: cover;
			border: 2px solid transparent;
		}
		#avatarPicker img.selected{
			border-color: var(--profile-accent);
		}
	</style>
</head>

<body>
<div th:replace="fragments/navbar :: navbar"></div>

<div class="container py-4">
	<div class="row g-4">

		<div class="col-12 col-lg-5">
			<div class="card card-accent shadow-sm">
				<div class="card-body">
					<div class="d-flex align-items-center gap-3">
						<img id="avatarImg" src="/t5/images/profileImages/default.png" alt="Avatar"
							 style="width:92px;height:92px;border-radius:18px;object-fit:cover;">
						<div class="flex-grow-1">
							<div class="d-flex align-items-center gap-2">
								<h4 class="mb-0" id="nicknameText">-</h4>
								<span id="visibilityBadge" class="badge text-bg-success">Public</span>
							</div>
							<div class="text-muted" id="nameText"></div>
							<div class="mt-2 small text-success" id="savedOk" style="display:none;">Saved ✔</div>
						</div>
					</div>

					<hr>

					<h6 class="mb-2">Statistiche</h6>
					<div class="row text-center">
						<div class="col">
							<div class="fw-semibold" id="matchesPlayed">0</div>
							<div class="text-muted small">Matches played</div>
						</div>
						<div class="col">
							<div class="fw-semibold" id="matchesWon">0</div>
							<div class="text-muted small">Matches won</div>
						</div>
						<div class="col">
							<div class="fw-semibold" id="lastMatch">-</div>
							<div class="text-muted small">Last match</div>
						</div>
					</div>

					<div class="mt-3">
						<h6 class="mb-2">Social</h6>
						<div class="row text-center">
							<div class="col">
								<div class="fw-semibold" id="followersCount">0</div>
								<div class="text-muted small">Followers</div>
							</div>
							<div class="col">
								<div class="fw-semibold" id="followingCount">0</div>
								<div class="text-muted small">Following</div>
							</div>
						</div>
						<div class="mt-2 text-center">
							<a href="/SearchFriend" class="btn btn-sm btn-outline-success">Cerca utenti</a>
						</div>
					</div>

					<hr>

					<h6 class="mb-2">Avatar</h6>
					<div id="avatarPicker" class="d-flex flex-wrap gap-2"></div>
				</div>
			</div>
		</div>

		<div class="col-12 col-lg-7">
			<div class="card card-accent shadow-sm mb-4">
				<div class="card-body">
					<h5 class="mb-3">Modifica profilo</h5>

					<div class="mb-3">
						<label class="form-label">Nickname (univoco)</label>
						<div class="d-flex gap-2">
							<input id="nicknameInput" class="form-control" placeholder="Nickname" />
							<button id="saveNicknameBtn" class="btn btn-success">
								<i class="bi bi-check2"></i> Save
							</button>
						</div>
						<div id="nicknameError" class="text-danger small mt-2" style="display:none;"></div>
					</div>

					<div class="mb-3">
						<label class="form-label">Bio</label>
						<textarea id="bioInput" class="form-control" rows="4" placeholder="Scrivi la tua bio..."></textarea>
						<div class="d-flex gap-2 mt-2">
							<button id="saveBioBtn" class="btn btn-outline-success">Save Bio</button>
							<button id="generateBioBtn" class="btn btn-success">
								<i class="bi bi-stars"></i> Generate Bio (AI)
							</button>
						</div>
					</div>
				</div>
			</div>

			<div class="card card-accent shadow-sm">
				<div class="card-body">
					<h5 class="mb-3">Preferenze</h5>

					<div class="row g-3">
						<div class="col-md-6">
							<label class="form-label">Background color</label>
							<input id="themeColor" type="color" class="form-control form-control-color" value="#0b1b2b">
						</div>
						<div class="col-md-6">
							<label class="form-label">Accent color</label>
							<input id="accentColor" type="color" class="form-control form-control-color" value="#198754">
						</div>

						<div class="col-md-6 d-flex align-items-end">
							<div class="form-check form-switch">
								<input class="form-check-input" type="checkbox" role="switch" id="publicSwitch">
								<label class="form-check-label" for="publicSwitch">Profilo pubblico</label>
							</div>
						</div>
					</div>

					<div class="mt-3 d-flex gap-2">
						<button id="savePrefsBtn" class="btn btn-success">
							<i class="bi bi-save"></i> Save Preferences
						</button>
						<button id="refreshBtn" class="btn btn-outline-secondary">
							<i class="bi bi-arrow-clockwise"></i> Refresh
						</button>
					</div>

				</div>
			</div>

		</div>

	</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- NECESSARI: forniscono getCookie/parseJwt e Username -->
<script th:src="@{/t5/js/UserUtil.js}"></script>

<!-- ✅ Qui usi il tuo file già aggiornato -->
<script th:src="@{/t5/js/profile.js}"></script>

</body>
</html>
