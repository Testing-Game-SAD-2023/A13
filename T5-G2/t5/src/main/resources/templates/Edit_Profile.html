<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
    <link rel="stylesheet" href="/t5/css/profile-edit.css">
</head>
<body>
    <!-- Header con il pulsante -->
    <header class="header">
        <a href="/profile" class="profile-link">
            <button id="player-email" class="profile-button" th:text="${player.email}">Torna al profilo utente</button>
        </a>
    </header>
    <!-- Dati utente nascosti -->
    <div id="player-data"
        th:data-current-bio="${player.userProfile.bio}"
        th:data-current-image="${player.userProfile.profilePicturePath}"
        hidden>
    </div>

    <!-- ============================== MODIFICA: input hidden per rendere disponibile l'email agli script esterni -->
    <input type="hidden" id="email" th:value="${player.email}">

    <!-- ============================== MODIFICA: div per le notifiche richiesto da notification.js -->
    <div id="notifications"></div>


    <!-- Contenuto principale -->
    <main class="content">

        <!-- ============================== AGGIUNTO: label per la scelta dell’immagine profilo ===== -->
        <label for="profile-pictures">Immagine profilo</label>

        <!-- Sezione immagini profilo -->
        <div id="profile-pictures">
            <img th:each="image : ${images}"
                th:src="@{/t5/images/profileImages/{image}(image=${image})}"
                th:class="${image == propic ? 'profile-picture selected' : 'profile-picture'}"
                alt="Profile Picture" />
        </div>

        <!-- ============================== AGGIUNTO: label per la biografia ===== --> 
        <label for="bio-input">Biografia</label>

        <!-- Campo per la bio -->
        <textarea id="bio-input" th:text="${bio}"></textarea>



        <!-- ============================== AGGIUNTO: label per il nickname ===== -->
        <label for="nickname-input">Nickname</label>

        <!-- ============================== AGGIUNTO: Campo per modificare il nickname -->
        <input type="text" id="nickname-input" th:value="${player.userProfile.nickname}" placeholder="Nickname">


        <!-- Pulsante per salvare -->
        <button id="save-button" th:text="#{editProfile.save}">Salva</button>
    </main>
    <div th:replace="fragments/footer :: footer"></div>
    <script src="/t5/js/profile-edit.js"></script>
</body>
</html>
