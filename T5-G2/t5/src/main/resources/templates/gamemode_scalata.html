<!DOCTYPE html>

<!--Adding Thymeleaf-->
<html lang="it" 
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:th="http://www.thymeleaf.org"
    data-bs-theme="dark">

<head>
    <div th:replace="fragments/header :: header"></div>
    
    <title id="title-scalata-gamemode" th:text="#{seleziona_scalata}"></title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.0/css/bulma.min.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/animations/scale-extreme.css">
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/themes/translucent.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS minimale SOLO per le card di selezione scalate -->
    <link rel="stylesheet" href="/t5/css/gamemode_scalata_minimal.css">

    <script src="https://code.jquery.com/jquery-3.1.1.min.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2/dist/umd/popper.min.js"></script>
    <script src="https://unpkg.com/tippy.js@6/dist/tippy-bundle.umd.js"></script>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- Le scalate sono già renderizzate nel DOM da Thymeleaf -->
    <!-- Non serve più passare dati JSON a JavaScript -->

</head>

<body class=bg-custom>
  
  <!--Navbar-->
  <nav class="navbar navbar-dark bg-dark" id="navbar">
      <a class="navbar-brand" href="javascript:void(0);">
        <i class="fas fa-stairs" th:text="#{seleziona_scalata}"></i> 
      </a>
      <button class="navbar-toggler" id="navbar-button" type="button" data-toggle="collapse" data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
    
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item active">
            <a class="nav-link" id="nav-go-back" href="/main" th:text="#{indietro}"> <span class="sr-only">(current)</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-logout" href="/logout" th:text="#{logout}"> <span class="sr-only">(current)</span></a>
          </li>
          <li class="nav-item">
            <a class="nav-link" id="nav-rules" href="#" data-toggle="modal" data-target="#rulesModal" th:text="#{regole}"></a>
          </li>
          <!-- <li class="nav-item">
            <a class="nav-link" id="nav-tour" href=#>Inizia il tour</a>
          </li> -->
        </ul>
      </div>
  </nav>

  <!-- SCHEDA CONTINUA - COPIATA ESATTAMENTE DA PARTITA SINGOLA -->
  <div class="container-fluid mt-3 d-none" id="scheda_continua_scalata">
    <div class="row justify-content-center row-cols-3">
      <div class="col"></div>
      <div class="col">
        <!-- Scheda continua gioco-->
        <div class="card">
          <h5 class="card-header text-center" th:text="#{scalata}"></h5>
          <div class="card-body">
            <!-- Form di selezione -->
            <div class="row">
              <div class="col">
                <h3 class="text-center mb-4" th:text="#{gamemode_alert}"></h3>
                <div class="row">
                  <ul class="list-group list-group-flush">
                    <li class="list-group-item">
                      <label th:text="#{nome_scalata}"> </label>
                      <span id="gamemode_scalata_nome"> </span>
                    </li>
                    <li class="list-group-item">
                      <label th:text="#{livello_corrente}"> </label>
                      <span id="gamemode_livello_corrente"> </span>
                    </li>
                    <li class="list-group-item">
                      <label th:text="#{totale_livelli}"></label>
                      <span id="gamemode_livelli_totali"> </span>
                    </li>
                    <li class="list-group-item">
                      <label th:text="#{modalità}"></label>
                      <span id="gamemode_modalita"> </span>
                    </li>
                    <li class="list-group-item">
                      <label th:text="#{tempo_rimanente}"></label>
                      <span id="gamemode_time_limit"> </span>
                    </li>
                  </ul>
                </div>

                <div class="d-flex gap-5 justify-content-between">
                  <!-- Set new Game-->
                  <div class="text-center pt-2">
                    <button
                      type="button"
                      class="btn btn-primary"
                      id="new_game"
                    >
                      <i class="bi bi-plus-lg" th:text="#{nuova_partita}"></i>
                    </button>
                  </div>
                  <!-- Link editor -->
                  <div class="text-center pt-2">
                    <a
                      class="btn btn-primary"
                      href="#"
                      role="button"
                      id="Continua"
                    >
                      <i class="bi bi-play-fill" th:text="#{riprendi_partita}"></i>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="col"></div>
    </div>
  </div>
  
  <!-- Container delle scalate - Renderizzato lato server con Thymeleaf (schermata di default) -->
  <div id="scalate-container" class="container">
    <div class="row">
      <!-- Itera su tutte le scalate disponibili -->
      <div th:each="scalata : ${lista_scalate}" class="col-md-4 mb-4">
        <div class="card scalata-card h-100 shadow-sm" 
             th:attr="data-name=${scalata.name},
                      data-levels=${scalata.totalLevels}"
             style="cursor: pointer; transition: all 0.3s ease;">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title text-center font-weight-bold" 
                th:text="${scalata.name}">Nome Scalata</h5>
            <hr>
            <p class="card-text text-center mb-3">
              <i class="fas fa-layer-group"></i>
              <strong>Livelli totali:</strong> 
              <span class="badge badge-primary badge-pill" 
                    th:text="${scalata.totalLevels}">0</span>
            </p>
            <p class="card-text text-muted text-center mt-auto" 
               th:if="${scalata.description}"
               th:text="${scalata.description}">
              Descrizione della scalata
            </p>
            <div class="text-center mt-3">
              <small class="text-muted">Clicca per selezionare</small>
            </div>
          </div>
        </div>
      </div>
      
      <!-- Messaggio se non ci sono scalate -->
      <div th:if="${#lists.isEmpty(lista_scalate)}" class="col-12 text-center">
        <div class="alert alert-warning" role="alert">
          <i class="fas fa-exclamation-triangle"></i>
          <strong>Nessuna scalata disponibile</strong>
          <p>Al momento non ci sono scalate da giocare.</p>
        </div>
      </div>
    </div>
  </div>
  <br>
  <br>
  <div class="text-center">
    <button type="button" id="submit-button" class="btn btn-light btn-lg" th:text="#{submit}"></button>
  </div>
  <br>
  <br>
<!--Regolamento modal dialog-->
<div class="modal fade" id="rulesModal" tabindex="-1" role="dialog" aria-labelledby="rulesModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="rulesModalLabel" th:text="#{regole}"></h5>
        <button type="button" class="close" data-dismiss="modal" aria-label="Close">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body" th:text="#{descrizione_scalata2}"></div>     
      <div class="modal-footer d-flex justify-content-center">
        <button type="button" class="btn btn-dark" data-dismiss="modal" th:text="#{chiudi}"></button>
      </div>
    </div>
  </div>
</div>

<!-- Footer con UserUtil.js e altre utility -->
<div th:replace="fragments/footer :: footer"></div>

<!-- IMPORTANTE: Caricato DOPO footer per avere UserUtil.js già disponibile -->
<script type="text/javascript" src="/t5/js/gamemode_scalata.js"></script>

</body>

</html>
