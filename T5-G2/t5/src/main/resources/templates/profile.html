<script>
$(document).ready(function () {
    $("#option_Followers").next("label").text(window.SOCIAL_i18n.followers_label);
    $("#option_Following").next("label").text(window.SOCIAL_i18n.following_label);
    $("#text-srh_follow").attr("placeholder", window.SOCIAL_i18n.search_followers);
    function setupVisibilityAndSearch(config) {
        let $radio1 = $("#" + config.radio1);
        let $radio2 = $("#" + config.radio2);
        let $block1 = $("#" + config.block1);
        let $block2 = $("#" + config.block2);
        let $searchInput = $("#" + config.searchInput);
 
 
        function aggiornaVisibilita() {
            if ($radio1.is(":checked")) { $block1.show(); $block2.hide(); $searchInput.attr("placeholder", config.placeholder1); }
            else if ($radio2.is(":checked")) { $block2.show(); $block1.hide(); $searchInput.attr("placeholder", config.placeholder2); }
        }
 
        $radio1.on("change", aggiornaVisibilita);
        $radio2.on("change", aggiornaVisibilita);
        aggiornaVisibilita();
 
        $searchInput.on("keyup", function () {
            let searchText = $(this).val().toLowerCase();
            let $activeBlock = $block1.is(":visible") ? $block1 : $block2;
            $activeBlock.find(".col.mb-4").each(function () {
                let name = $(this).find("h5").text().toLowerCase();
                let email = $(this).find("span").text().toLowerCase();
                $(this).toggle(name.includes(searchText) || email.includes(searchText));
            });
        });
    }
 
    setupVisibilityAndSearch({
        radio1: "option_Followers",
        radio2: "option_Following",
        block1: "followers_block",
        block2: "following_block",
        searchInput: "text-srh_follow",
        placeholder1: "Search Followers",
        placeholder2: "Search Following"
    });
 
    var userId = $("#userProfileID").text();
    console.log("[DEBUG] userProfileID letto dalla pagina:", userId);
 
 
    function fetchAndUpdateUserBlock(endpoint, blockId, countId) {
        $.ajax({
            url: endpoint,
            type: "GET",
            data: { userId: userId },
            dataType: "json",
            success: function (response) {
 
                console.log("[DEBUG] Risposta da", endpoint, "=>", response); // <---- DEBUG    
                updateUserBlock(blockId, response, countId);
            },
            
            error: function () { $(blockId).html("<p style='color:red;'>Errore durante il caricamento.</p>"); }
        });
    }
 
    function updateUserBlock(blockId, users, countId) {
        let container = $(blockId);
        container.empty();
        $(countId).text(users.length);
        users.forEach(user => {
 
            container.append(`
                <div class="col mb-4">
                    <div class="card user-card p-3">
                        <div class="d-flex align-items-center w-100">
 
                            <!-- SEZIONE 1: NICKNAME -->
                            <div class="nickname-box me-4">
                                ${user.nickname}
                            </div>
 
                            <!-- SEZIONE 2: INFO UTENTE -->
                            <div class="user-info flex-grow-1">
                                <div class="user-name">
                                    ${user.name} ${user.surname}
                                </div>
                                <div class="user-email">
                                    ${user.email}
                                </div>
                            </div>
 
                            <!-- SEZIONE 3: PULSANTE -->
                            <div class="ms-3">
                                <a class="btn btn-primary" href="/friend/${user.id}">
                                    ${window.SOCIAL_i18n.go_to_profile}
                                </a>
                            </div>
 
 
                        </div>
                    </div>
                </div>
                `);
 
        });
    }
 

    fetchAndUpdateUserBlock("/api/gameEngine/followers", "#followers_block", "#followersCount");
    fetchAndUpdateUserBlock("/api/gameEngine/following", "#following_block", "#followingCount");
 
});
</script>
 
 
 
 
<script>
document.addEventListener("DOMContentLoaded", function () {
 
    /* -------------------------------
       1) IMPOSTAZIONE VISUALIZZAZIONE
       ------------------------------- */
    function setupVisibilityAndSearch(config) {
        let $radio1 = $("#" + config.radio1);
        let $radio2 = $("#" + config.radio2);
        let $block1 = $("#" + config.block1);
        let $block2 = $("#" + config.block2);
        let $searchInput = $("#" + config.searchInput);
 
        function aggiornaVisibilita() {
            if ($radio1.is(":checked")) {
                $block1.show();
                $block2.hide();
                $searchInput.attr("placeholder", config.placeholder1);
            } else if ($radio2.is(":checked")) {
                $block2.show();
                $block1.hide();
                $searchInput.attr("placeholder", config.placeholder2);
            }
        }
 
        $radio1.on("change", aggiornaVisibilita);
        $radio2.on("change", aggiornaVisibilita);
        aggiornaVisibilita();
 
        $searchInput.on("keyup", function () {
            let searchText = $(this).val().toLowerCase();
            let $activeBlock = $block1.is(":visible") ? $block1 : $block2;
 
            $activeBlock.find(".col.mb-4").each(function () {
                let name = $(this).find("h5").text().toLowerCase();
                let email = $(this).find("span").text().toLowerCase();
                $(this).toggle(name.includes(searchText) || email.includes(searchText));
            });
        });
    }
 
    setupVisibilityAndSearch({
        radio1: "option_Followers",
        radio2: "option_Following",
        block1: "followers_block",
        block2: "following_block",
        searchInput: "text-srh_follow",
        placeholder1: "Search Followers",
        placeholder2: "Search Following"
    });
 
    /* -------------------------------
       2) FETCH DEI FOLLOWERS SOLO QUANDO
          SI APRE IL TAB "SOCIAL"
       ------------------------------- */
 
    const socialTab = document.getElementById("pills-social-tab");
    let socialLoaded = false;
 
    if (socialTab) {
        socialTab.addEventListener("shown.bs.tab", function () {
 
            if (socialLoaded) return;  // evita richiami multipli
            socialLoaded = true;
 
            const userId = $("#userProfileID").text();
 
            function fetchAndUpdateUserBlock(endpoint, blockId, countId) {
                $.ajax({
                    url: endpoint,
                    type: "GET",
                    data: { userId: userId },
                    dataType: "json",
                    success: response => updateUserBlock(blockId, response, countId),
                    error: () => $(blockId).html("<p style='color:red;'>Errore durante il caricamento.</p>")
                });
            }
 
            function updateUserBlock(blockId, users, countId) {
                let container = $(blockId);
                container.empty();
                $(countId).text(users.length);
 
                users.forEach(user => {
                    container.append(`
                <div class="col mb-4">
                    <div class="card user-card p-3">
                        <div class="d-flex align-items-center w-100">
 
                            <!-- SEZIONE 1: NICKNAME -->
                            <div class="nickname-box me-4">
                                ${user.nickname}
                            </div>
 
                            <!-- SEZIONE 2: INFO UTENTE -->
                            <div class="user-info flex-grow-1">
                                <div class="user-name">
                                    ${user.name} ${user.surname}
                                </div>
                                <div class="user-email">
                                    ${user.email}
                                </div>
                            </div>
 
                            <!-- SEZIONE 3: PULSANTE -->
                            <div class="ms-3">
                                <a class="btn btn-primary" href="/friend/${user.id}">
                                    ${window.SOCIAL_i18n.go_to_profile}
                                </a>
                            </div>
 
                        </div>
                    </div>
                </div>
                `);
 
                });
            }
 

 
            fetchAndUpdateUserBlock("/api/gameEngine/social/followers", "#followers_block", "#followersCount");  
            fetchAndUpdateUserBlock("/api/gameEngine/social/following", "#following_block", "#followingCount");  
 
 
        });
    }
});
</script>

<!-- FOLLOW BUTTON SCRIPT -->
 
<div th:if="${isFriendProfile == true}">
<script>
document.addEventListener("DOMContentLoaded", async function () {
    const followButton = document.getElementById("followButton");
    const followingID = document.getElementById("userProfileID").textContent;
    const followerID = document.getElementById("viewID").textContent;
    if (!followButton) return;
 
 
async function updateFollowButton() {
    const response = await fetch(`/api/gameEngine/isFollowing?followerId=${followerID}&followingId=${followingID}`); //============================== MODIFICATO: /api/userService/profile
    const isFollowing = await response.json();
    followButton.classList.toggle("btn-info", !isFollowing);
    followButton.classList.toggle("btn-danger", isFollowing);
    followButton.textContent = isFollowing ? "Unfollow" : "Follow";
}
 
await updateFollowButton();
 
followButton.addEventListener("click", async () => {
    followButton.disabled = true;
    try {
        const params = new URLSearchParams({ followerId: followerID, followingId: followingID });
        const response = await fetch(`/api/gameEngine/toggle_follow?${params.toString()}`, { method: "POST" }); //============================== MODIFICATO CORRETTO
        const isFollowing = await response.json();
        followButton.classList.toggle("btn-info", !isFollowing);
        followButton.classList.toggle("btn-danger", isFollowing);
        followButton.textContent = isFollowing ? "Unfollow" : "Follow";
    } finally { followButton.disabled = false; }
});
 
 
}); </script>
