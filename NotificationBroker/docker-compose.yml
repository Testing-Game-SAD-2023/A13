services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "await_startup"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - global-network # Aggiunto alla rete globale

  notification-broker:
    build: .
    container_name: notification-broker
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    networks:
      - global-network # Aggiunto alla rete globale

networks:
  global-network:
    external: true # Dichiarato come rete esterna
