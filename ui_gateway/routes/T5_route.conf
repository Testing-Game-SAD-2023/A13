set $backend_T5 "http://t5-controller:8085";

### 📌 UTENTE & PROFILO
location ~ ^/(profile|edit_profile|Notification|Team|Achievement|SearchFriend|Games) {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 SOCIAL & AMICI
location ~ ^/(friend/[0-9]+|follow/[0-9]+) {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 GAMEMODE & GIOCO
location ~ ^/(gamemode_scalata|gamemode) {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 MESSAGGI
location = /messages/new {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 CLASSIFICHE & REPORT
location ~ ^/(leaderboard) {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 GENERICO & INTERFACCIA
location ~ ^/(main|editor|t5) {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 INBOX
location = /messages/inbox {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 DELETE MESSAGGI
location = /messages/delete {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

location ~ ^/messages(/.*)?$ {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

### 📌 OUTBOX
location = /messages/outbox {
    include /etc/nginx/includes/proxy.conf;
    proxy_pass $backend_T5;
}

